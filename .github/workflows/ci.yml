name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: bingo
          POSTGRES_PASSWORD: test-only-password
          POSTGRES_DB: bingo_e2e
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U bingo -d bingo_e2e"
          --health-interval 3s --health-timeout 3s --health-retries 20
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
    env:
      NODE_ENV: test
      DATABASE_URL: postgresql://bingo:test-only-password@127.0.0.1:5432/bingo_e2e
      E2E_DATABASE_URL: postgresql://bingo:test-only-password@127.0.0.1:5432/bingo_e2e
      REDIS_URL: redis://127.0.0.1:6379
      SEED_ENCRYPTION_KEY: '1313131313131313131313131313131313131313131313131313131313131313'
      TURNSTILE_BYPASS: 'true'
      REAL_MONEY_ENABLED: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.25.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test:coverage
      - run: pnpm test:integration
      - run: NODE_ENV=production pnpm build
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm db:migrate
      - name: Start E2E API
        run: |
          pnpm --filter @bingo/api start > /tmp/bingo-api.log 2>&1 &
          for attempt in $(seq 1 30); do
            if curl --fail http://localhost:4000/ready; then exit 0; fi
            sleep 1
          done
          cat /tmp/bingo-api.log
          exit 1
      - run: pnpm test:e2e
      - run: pnpm audit --audit-level critical
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: verification-evidence
          path: |
            coverage
            playwright-report
            test-results
  compose-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Configure isolated demo secret
        run: |
          cp .env.example .env
          sed -i "s/GENERATE_WITH_NODE_CRYPTO_32_BYTES_HEX/$(openssl rand -hex 32)/" .env
      - name: Build and start complete demo
        run: docker compose up --build -d
      - name: Verify API, player app and admin
        run: |
          for attempt in $(seq 1 90); do
            if curl --fail http://localhost:4000/ready && curl --fail -o /dev/null http://localhost:3000 && curl --fail -o /dev/null http://localhost:3001; then exit 0; fi
            sleep 2
          done
          exit 1
      - name: Verify backup can be restored
        run: |
          docker compose exec -T postgres pg_dump -U bingo -Fc bingo > /tmp/bingo-backup.dump
          docker compose exec -T postgres createdb -U bingo restore_check
          docker compose exec -T postgres pg_restore -U bingo -d restore_check < /tmp/bingo-backup.dump
          test "$(docker compose exec -T postgres psql -U bingo -d restore_check -Atc 'SELECT count(*) FROM schema_migrations')" = '3'
          docker compose exec -T postgres dropdb -U bingo restore_check
      - name: Capture diagnostics
        if: always()
        run: docker compose logs --no-color > compose.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: compose-evidence
          path: compose.log
      - name: Stop isolated demo
        if: always()
        run: docker compose down -v
